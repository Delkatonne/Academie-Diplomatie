{% if current_user.is_authenticated %}
<span class="user-chip">{{ current_user.full_name }}</span>
{% if current_user.has_role('admin') %}<a class="btn btn-outline" href="{{ url_for('admin.dashboard') }}">Administration</a>{% endif %}
<a class="btn btn-outline" href="{{ url_for('student.espace') }}">Mon espace</a>
<form class="inline-form" method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-primary" type="submit">Déconnexion</button></form>
{% else %}
<a class="btn btn-outline" href="{{ url_for('auth.login') }}">Connexion</a>
<a class="btn btn-primary" href="{{ url_for('auth.register') }}">S'inscrire</a>
{% endif %}
